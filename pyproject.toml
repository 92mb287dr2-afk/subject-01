[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subject-01"
version = "0.1.0"
description = "Deterministic persistent artificial-life research environment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
subject01 = "subject01.cli:main"
subject01-observer = "subject01.observer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
subject01 = ["web/*.html", "web/*.css", "web/*.js"]
